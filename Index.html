<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#336b5b"><title>Mi cocina · Menús y compras</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26352f;background:#f5f6f1}*{box-sizing:border-box}body{margin:0}header{background:#336b5b;color:white;padding:22px max(18px,calc((100vw - 950px)/2))}header h1{margin:3px 0;font-size:26px}header p{margin:0;opacity:.85}main{max-width:950px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}button{cursor:pointer;font:inherit}nav button,.btn{border:0;border-radius:12px;padding:11px 15px;background:white;color:#315e51;font-weight:650;white-space:nowrap}nav button.active,.primary{background:#336b5b;color:white}.panel{background:white;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 2px 12px #1b37220a}h2{margin:0 0 12px;font-size:21px}h3{margin:15px 0 10px}small,.muted{color:#65756d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eaf1ea;padding:14px;border-radius:12px}.stat b{display:block;font-size:21px}.product{display:grid;grid-template-columns:26px 1fr 110px;gap:10px;align-items:center;border-top:1px solid #edf0eb;padding:12px 0}.product label{display:block;font-weight:600}.product small{display:block;margin-top:3px}input[type=number],input[type=text],textarea{font:inherit;border:1px solid #d5ded5;border-radius:9px;padding:9px;max-width:100%;width:100%}input[type=checkbox]{width:19px;height:19px;accent-color:#336b5b}.done label{text-decoration:line-through;color:#7a857e}.day{border-top:1px solid #e9ede8;padding:12px 0}.day strong{display:block;margin-bottom:7px}.meal{display:grid;grid-template-columns:82px 1fr;align-items:start;gap:9px;margin:8px 0}.meal span{font-size:13px;color:#627368;padding-top:9px}.meal textarea{resize:vertical;min-height:57px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{max-width:230px}.checkrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.hint{background:#eef4e8;border-radius:12px;padding:12px;color:#48644c}.snack{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #eee;padding:14px 0}.snack small{display:block;margin-top:5px}.hidden{display:none}.foot{font-size:12px;color:#7b867d;text-align:center;padding:10px 0 25px}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.product{grid-template-columns:25px 1fr 92px}.stat b{font-size:17px}}</style></head><body><header><h1>Mi cocina</h1><p>Menús y compras · 16–30 octubre 2026 · 2 personas</p></header><main><nav><button class="active" data-tab="home">Resumen</button><button data-tab="shopping">Compras</button><button data-tab="menu">Menú</button><button data-tab="pantry">Despensa</button><button data-tab="snacks">Botanas</button><button data-tab="settings">Datos</button></nav><section id="home"></section><section id="shopping" class="hidden"></section><section id="menu" class="hidden"></section><section id="pantry" class="hidden"></section><section id="snacks" class="hidden"></section><section id="settings" class="hidden"></section><p class="foot">Los datos se guardan en este navegador. Exporta un respaldo si cambias de dispositivo.</p></main><script>

y": "Verduras y hierbas", "name": "Rábanos", "qty": "1 manojo", "bought": false, "price": ""}, {"id": 32, "category": "Verduras y hierbas", "name": "Ajo", "qty": "1 cabeza, si hace falta", "bought": false, "price": ""}, {"id": 33, "category": "Verduras y hierbas", "name": "Limón", "qty": "500 g–1 kg adicionales, según existencias", "bought": false, "price": ""}, {"id": 34, "category": "Frutas y extras", "name": "Manzanas", "qty": "1–1.5 kg adicionales, según existencias", "bought": false, "price": ""}, {"id": 35, "category": "Frutas y extras", "name": "Papaya o piña", "qty": "1 pieza", "bought": false, "price": ""}, {"id": 36, "category": "Frutas y extras", "name": "Naranjas o mandarinas", "qty": "1–1.5 kg", "bought": false, "price": ""}, {"id": 37, "category": "Frutas y extras", "name": "Plátano u otra fruta de temporada", "qty": "1 kg, opcional", "bought": false, "price": ""}, {"id": 38, "category": "Frutas y extras", "name": "Queso fresco para complementar", "qty": "200–300 g, opcional", "bought": false, "price": ""}], "menu": [{"date": "2026-10-16", "breakfast": "Yogur con manzana y chía / Miguel: chilaquiles rojos con huevos y queso", "lunch": "Salmas con atún, jitomate, cebolla, limón y col; Miguel: quesadillas opcionales", "dinner": "Tacos de tinga de pollo"}, {"date": "2026-10-17", "breakfast": "Huevos a la mexicana, frijoles, tortillas y fruta", "lunch": "Pescado al limón con arroz, brócoli y ejotes", "dinner": "Boneless caseros, papas gajo y verduras con aderezo de yogur"}, {"date": "2026-10-18", "breakfast": "Avena con manzana y leche / Miguel: huevos a la mexicana, frijoles y tortillas", "lunch": "Picadillo de res con zanahoria y calabacita", "dinner": "Quesadillas de queso con calabacita, jitomate y col"}, {"date": "2026-10-19", "breakfast": "Pan francés con canela y manzana", "lunch": "Bowl de pollo con arroz, brócoli y ejotes", "dinner": "Tacos de frijoles con queso, jitomate y col"}, {"date": "2026-10-20", "breakfast": "Yogur con fruta / Miguel: huevos rancheros con frijoles", "lunch": "Tinga de pollo con tortillas y verduras", "dinner": "Pasta con jitomate, ajo, calabacita y pollo"}, {"date": "2026-10-21", "breakfast": "Huevos con jitomate, tortillas y fruta", "lunch": "Picadillo sobrante con tortillas y verduras", "dinner": "Tostadas horneadas de frijoles con queso y lechuga o col"}, {"date": "2026-10-22", "breakfast": "Yogur con fruta / Miguel: tacos de huevo a la mexicana", "lunch": "Bowl de arroz, frijoles, verduras y queso", "dinner": "Tacos de bistec con cebolla, pimiento y salsa"}, {"date": "2026-10-23", "breakfast": "Pan francés con canela y manzana, o yogur con fruta", "lunch": "Pasta con pollo y verduras", "dinner": "Quesadillas con champiñones o calabacita"}, {"date": "2026-10-24", "breakfast": "Huevos con queso y verduras, tortillas y fruta", "lunch": "Pescado al ajo y limón con arroz y verduras", "dinner": "Boneless o alitas, papas gajo y verduras"}, {"date": "2026-10-25", "breakfast": "Yogur con fruta y chía / Miguel: chilaquiles verdes con pollo", "lunch": "Tacos dorados de pollo y frijoles con lechuga y salsa", "dinner": "Pozole de pollo con lechuga, rábano, cebolla y limón"}, {"date": "2026-10-26", "breakfast": "Huevos con queso, tortillas y fruta opcional", "lunch": "Albóndigas de res en salsa de jitomate con arroz", "dinner": "Tostadas de pollo con frijoles, col y salsa"}, {"date": "2026-10-27", "breakfast": "Yogur con fruta / Miguel: sincronizadas de pollo y queso", "lunch": "Albóndigas sobrantes con verduras", "dinner": "Quesadillas de champiñones con queso y pico de gallo"}, {"date": "2026-10-28", "breakfast": "Pan francés con canela y manzana", "lunch": "Pollo estilo asiático con verduras, arroz y soya baja en sodio", "dinner": "Tacos de frijoles con queso, col y salsa"}, {"date": "2026-10-29", "breakfast": "Yogur con manzana y chía / Miguel: tacos de frijoles, queso y huevo opcional", "lunch": "Pescado al limón con arroz y verduras", "dinner": "Tacos de pollo con cebolla, pimiento y salsa"}, {"date": "2026-10-30", "breakfast": "Yogur con fruta o huevos / Miguel: omelette de queso con jitomate", "lunch": "Bowl de arroz, frijoles, queso y verduras", "dinner": "Tacos dorados de pollo o frijoles con lechuga o col"}], "checks": [{"text": "Contar los huevos disponibles", "done": false}, {"text": "Revisar pasta y pan", "done": false}, {"text": "Revisar verduras, limón y manzanas", "done": false}, {"text": "Revisar aceite, ajo, canela y salsa", "done": false}, {"text": "Comprar primero lo necesario y congelar proteínas para después", "done": false}], "budget": "", "pantry": ""};const key='mi-cocina-oct-2026-v2';let state;try{state=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch(e){state=structuredClone(initial)};const save=()=>{localStorage.setItem(key,JSON.stringify(state));render()};const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const sum=()=>state.products.reduce((a,p)=>a+(p.bought?(Number(p.price)||0):0),0);const purchased=()=>state.products.filter(p=>p.bought).length;const el=id=>document.getElementById(id);function render(){const total=state.products.length;el('home').innerHTML=`<div class="panel"><h2>Tu quincena</h2><div class="stats"><div class="stat"><small>Comprados</small><b>${purchased()} / ${total}</b></div><div class="stat"><small>Gastado</small><b>${money(sum())}</b></div><div class="stat"><small>Disponible</small><b>${money((Number(state.budget)||0)-sum())}</b></div></div><p class="muted">15 días de desayuno, comida y cena. Precios registrados en pesos mexicanos.</p><button class="btn primary" onclick="tab('shopping')">Ir a mi lista</button></div><div class="panel"><h2>Antes de comprar</h2>${state.checks.map((c,i)=>`<label class="checkrow"><input type="checkbox" ${c.done?'checked':''} onchange="state.checks[${i}].done=this.checked;save()"><span>${esc(c.text)}</span></label>`).join('')}</div>`;let groups=[...new Set(state.products.map(p=>p.category))];el('shopping').innerHTML=`<div class="panel"><h2>Lista de compras</h2><div class="toolbar"><label>Presupuesto ($) <input type="number" min="0" step="0.01" value="${esc(state.budget)}" onchange="state.budget=this.value;save()"></label><button class="btn" onclick="addProduct()">+ Producto</button></div><div class="stats"><div class="stat"><small>Presupuesto</small><b>${money(state.budget)}</b></div><div class="stat"><small>Gastado</small><b>${money(sum())}</b></div><div class="stat"><small>Restante</small><b>${money((Number(state.budget)||0)-sum())}</b></div></div></div>${groups.map(g=>`<div class="panel"><h3>${esc(g)}</h3>${state.products.filter(p=>p.category===g).map(p=>`<div class="product ${p.bought?'done':''}"><input aria-label="Comprado ${esc(p.name)}" type="checkbox" ${p.bought?'checked':''} onchange="updateProduct(${p.id},'bought',this.checked)"><div><label>${esc(p.name)}</label><small>${esc(p.qty)}</small></div><div><small>Costo ($)</small><input aria-label="Costo de ${esc(p.name)}" type="number" min="0" step="0.01" placeholder="0.00" value="${esc(p.price)}" onchange="updateProduct(${p.id},'price',this.value)"></div></div>`).join('')}</div>`).join('')}`;el('menu').innerHTML=`<div class="panel"><h2>Menú de 15 días</h2><p class="muted">Edita cada comida; los cambios se guardan automáticamente. Las comidas diferenciadas para cada persona se conservan.</p>${state.menu.map((d,i)=>`<div class="day"><strong>${new Date(d.date+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</strong>${[['breakfast','Desayuno'],['lunch','Comida'],['dinner','Cena']].map(([field,label])=>`<div class="meal"><span>${label}</span><textarea onchange="state.menu[${i}]['${field}']=this.value;save()">${esc(d[field])}</textarea></div>`).join('')}</div>`).join('')}</div>`;el('pantry').innerHTML=`<div class="panel"><h2>Mi despensa</h2><p class="muted">Anota lo que ya tienes. Este inventario es informativo: todavía no descuenta cantidades automáticamente.</p><textarea id="pantryText" rows="10" placeholder="Ej. 8 huevos, 500 g de arroz, aceite...">${esc(state.pantry||'')}</textarea><p><button class="btn primary" onclick="state.pantry=el('pantryText').value;save()">Guardar despensa</button></p></div>`;el('snacks').innerHTML=`<div class="panel"><h2>Noche de botanas</h2><p class="muted">Ideas para planear una cena especial en casa. Selecciona una opción para agregarla a una fecha del menú; revisa los ingredientes antes de comprar.</p>${[['Boneless caseros','Pollo para boneless, empanizado, salsa y verduras'],['Alitas al horno o freidora','Alitas, especias, limón y salsa'],['Dedos de queso','Queso para derretir, huevo y pan molido'],['Papas gajo','Papas, especias y aceite']].map(([name,ingredients])=>`<div class="snack"><div><strong>${name}</strong><small>${ingredients}</small></div><button class="btn" onclick="planSnack('${name}')">Añadir al menú</button></div>`).join('')}<p class="hint">Las salsas, los empanizados y las papas pueden aportar sodio y carbohidratos. Las porciones deben ajustarse a las indicaciones médicas individuales.</p></div>`;el('settings').innerHTML=`<div class="panel"><h2>Respaldo de datos</h2><p>Descarga tus compras, precios, menú y despensa para conservarlos.</p><div class="toolbar"><button class="btn primary" onclick="exportData()">Exportar respaldo</button><label class="btn">Importar respaldo <input style="display:none" type="file" accept="application/json" onchange="importData(this.files[0])"></label></div><p class="hint">Esta versión funciona sin cuenta. Los datos permanecen en el navegador de este dispositivo y no se sincronizan con otros celulares.</p></div>`}function updateProduct(id,k,v){const p=state.products.find(p=>p.id===id);if(p){p[k]=v;save()}}function addProduct(){let name=prompt('Nombre del producto');if(!name?.trim())return;let qty=prompt('Cantidad sugerida')||'';let category=prompt('Categoría','Otros')||'Otros';state.products.push({id:Math.max(0,...state.products.map(p=>p.id))+1,name:name.trim(),qty,category,bought:false,price:''});save()}function planSnack(name){const date=prompt('Fecha (AAAA-MM-DD) para la cena:',state.menu[0]?.date||'2026-10-18');if(!date)return;const d=state.menu.find(x=>x.date===date);if(!d){alert('La fecha no está en el menú actual.');return}d.dinner=name;save();tab('menu')}function tab(id){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id))}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='mi-cocina-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.products)||!Array.isArray(d.menu))throw Error();if(confirm('¿Reemplazar los datos actuales por este respaldo?')){state=d;save()}}catch(e){alert('El archivo no es un respaldo válido.')}}render();
</script></body></html>
